name: APK derle
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: En son yuklenen zipi ac
        run: |
          ZIP="$(git -c core.quotepath=off log --name-only --format= --diff-filter=AM -- '*.zip' | head -n 1)"
          echo "Kullanilan: $ZIP"
          unzip -q -o "$ZIP" -d proje
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Derle
        working-directory: proje
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Son APK
          files: proje/app/build/outputs/apk/debug/app-debug.apk
